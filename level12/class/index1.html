<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

<h2>Registration Form</h2>

<form>

    First Name:
    <input type="text" placeholder="Enter First Name"><br><br>

    Last Name:
    <input type="text" placeholder="Enter Last Name"><br><br>

    Email:
    <input type="email" placeholder="Enter Email Address"><br><br>

    Password:
    <input type="password"><br><br>

    Gender:
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Other
    <br><br>

    Age:
    <input type="number" min="1" max="100"><br><br>

    Preferences:<br>
    <input type="checkbox"> Acrylic Painting<br>
    <input type="checkbox"> Oil Painting<br>
    <input type="checkbox"> Water Color Painting<br><br>

    Occupation:
    <select>
        <option>Student</option>
        <option>Teacher</option>
        <option>Artist</option>
        <option>Other</option>
    </select>
    <br><br>

    About Yourself:<br>
    <textarea rows="4" cols="30" placeholder="Share few lines about yourself..."></textarea>
    <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Clear">

</form>

</body>
</html>
