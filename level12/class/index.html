<!DOCTYPE html>
<html>
<head>
    <title>All Input Types</title>
</head>
<body>

<form>

    <!-- ტექსტის შეყვანა -->
    Name: <input type="text" placeholder="Enter your name"><br><br>

    <!-- პაროლი (სიმბოლოები დამალულია) -->
    Password: <input type="password"><br><br>

    <!-- ელფოსტა (ამოწმებს სწორ ფორმატს) -->
    Email: <input type="email"><br><br>

    <!-- რიცხვი (შეგიძლიათ მიუთითოთ min/max) -->
    Age: <input type="number" min="1" max="100"><br><br>

    <!-- თარიღის არჩევა -->
    Birthdate: <input type="date"><br><br>

    <!-- დროის არჩევა -->
    Time: <input type="time"><br><br>

    <!-- ფაილის ატვირთვა -->
    Upload File: <input type="file"><br><br>

    <!-- ფერის არჩევა -->
    Favorite Color: <input type="color"><br><br>

    <!-- Range (სლაიდერი) -->
    Volume: <input type="range" min="0" max="100"><br><br>

    <!-- Checkbox (მრავალი არჩევანი შესაძლებელია) -->
    Subscribe: <input type="checkbox"><br><br>

    <!-- Radio (მხოლოდ ერთი არჩევანი შეიძლება) -->
    Gender:
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <br><br>

    <!-- ტელეფონის ნომერი -->
    Phone: <input type="tel"><br><br>

    <!-- URL (ვებგვერდის მისამართი) -->
    Website: <input type="url"><br><br>

    <!-- დამალული ველი (მომხმარებელი ვერ ხედავს) -->
    <input type="hidden" value="12345">

    <!-- ღილაკი -->
    <input type="button" value="Click Me">

    <!-- ფორმის გაგზავნა -->
    <input type="submit" value="Submit">

    <!-- ფორმის გასუფთავება -->
    <input type="reset" value="Reset">

</form>

</body>
</html>
