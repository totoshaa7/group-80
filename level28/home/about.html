<!DOCTYPE html>
<html>
<head>
    <title>News</title>

    <style>
        body{
            background:#1a1a1a;
            color:white;
            font-family:Tahoma;
        }

        h1{
            text-align:center;
            color:yellow;
        }

        .card{
            background:#333;
            width:70%;
            margin:20px auto;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 10px black;
        }

        .card:hover{
            background:#444;
        }
    </style>

</head>
<body>

    <h1>Gaming News</h1>

    <div class="card">
        <h2>New GTA Trailer</h2>
        <p>ახალი GTA ტრეილერი გამოვიდა.</p>
    </div>

    <div class="card">
        <h2>Valorant Update</h2>
        <p>დაემატა ახალი აგენტი.</p>
    </div>

</body>
</html>
