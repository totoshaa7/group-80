<form action="#" method="post">
  <label>რა არის შენს აზრით საუკეთესო სეზონი?</label><br>

  <input type="radio" id="spring" name="season" value="spring" required>
  <label for="spring">გაზაფხული</label><br>

  <input type="radio" id="summer" name="season" value="summer">
  <label for="summer">ზაფხული</label><br>

  <input type="radio" id="autumn" name="season" value="autumn">
  <label for="autumn">შემოდგომა</label><br>

  <input type="radio" id="winter" name="season" value="winter">
  <label for="winter">ზამთარი</label><br><br>

  <button type="submit">გაგზავნა</button>
</form>
