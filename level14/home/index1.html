<form action="#" method="post"> 
  <label for="first_name">სახელი:</label>
  <input type="text" id="first_name" name="first_name" required>

  <label for="last_name">გვარი:</label>
  <input type="text" id="last_name" name="last_name" required>

  <label for="email">მეილი:</label>
  <input type="email" id="email" name="email" required>

  <label for="amount">თანხის რაოდენობა:</label>
  <input type="number" id="amount" name="amount" required min="0">

  <p>სქესი:</p>
  <input type="radio" id="male" name="gender" value="male" required>
  <label for="male">მამრობითი</label>

  <input type="radio" id="female" name="gender" value="female">
  <label for="female">მდედრობითი</label>

  <input type="radio" id="other" name="gender" value="other">
  <label for="other">სხვა</label>
  
  <label for="currency">ფულის ერთეული:</label>
  <select id="currency" name="currency" required>
    <option value="" disabled selected>select currency</option>
    <option value="gel">ლარი</option>
    <option value="usd">დოლარი</option>
    <option value="eur">ევრო</option>
  </select>

  <br><br>
  <button type="submit">რეგისტრაცია</button>
</form>
